<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Creature Search APP</title>
    <link rel="stylesheet" href="./RPG Creature Search App.css">
</head>
<body>
    <h1>RPG Creature Search App</h1>
    <div>
        <div>
            <label>Search for Creature Name or ID:</label>
            <input type="text" id="search-input" required>
            <button id="search-button">Search</button>
        </div>
        <div>
            <span id="creature-name"></span><span id="creature-id"></span>
            <span id="weight"></span><span id="height"></span>
            <div id="types"></div>

            <span></span>
            <p></p>
        </div>
        <table>
            <tr>
                <th>Base</th>
                <th>Stats</th>
            </tr>
            <tr>
                <td>HP:</td>
                <td id="hp"></td>
            </tr>
            <tr>
                <td>Attack:</td>
                <td id="attack"></td>
            </tr>
            <tr>
                <td>Defense:</td>
                <td id="defense"></td>
            </tr>
            <tr>
                <td>Sp. Attack:</td>
                <td id="special-attack"></td>
            </tr>
            <tr>
                <td>Sp. Defense:</td>
                <td id="special-defense"></td>
            </tr>
            <tr>
                <td>Speed:</td>
                <td id="speed"></td>
            </tr>
        </table>
    </div>
</body>
<script src="./RPG Creature Search App.js"></script>
</html>
