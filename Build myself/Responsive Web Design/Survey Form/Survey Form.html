<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./Survey Form.css">
  <title>survey-form,freecodecamp.rocks</title>
</head>

<body>
  <header>
  <h1 id="title">freeCodeCamp Survey Form</h1>
<p id="description">Thank you for taking the time to help us improve the platform</p>
</header>

<div class="form">
<form id="survey-form">
  <label for="name" id="name-label">Name</label><input id="name" type="text" placeholder="Enter your name" required/>

  <label for="email" id="email-label">Email</label><input id="email" 
  type="email" placeholder="Enter your Email" required/>

  <label for="number" id="number-label">Age(optional)</label><input id="number" type="number" placeholder="Age" min="13" max="120"/>

  <label for="dropdown">Which option best describes your current role?</label>
  <select id="dropdown">
<option>Select current role</option>
<option>Student</option>
<option>Full time Job</option>
<option>Full time Learner</option>
<option>Prefer not tosay</option>
<option>other</option>
  </select>

  <label>Would you recommend freeCodeCamp to a friend?</label>
 
  <div class="radio-group">
    <label><input type="radio" name="recommend" value="Definitely"> Definitely</label>
    <label><input type="radio" name="recommend" value="Maybe"> Maybe</label>
    <label><input type="radio" name="recommend" value="Not sure"> Not sure</label>
  </div>

  <label for="dropdown">What is your favorite feature of freeCodeCamp?</label>
  <select id="dropdown">
<option>Select an option</option>
<option>Challenges</option>
<option>Projects</option>
<option>Community</option>
<option>Open Source</option>
  </select>

<label>What would you like to see improved?(Check all that apply)</label>
<div class="checkbox-group">
    <label><input type="checkbox" value="Front-end Projects"> Front-end Projects</label>
    <label><input type="checkbox" value="Back-end Projects"> Back-end Projects</label>
    <label><input type="checkbox" value="Data Visualization"> Data Visualization</label>
    <label><input type="checkbox" value="Challenges"> Challenges</label>
    <label><input type="checkbox" value="Open Source Community"> Open Source Community</label>
    <label><input type="checkbox" value="Gitter help rooms"> Gitter help rooms</label>
    <label><input type="checkbox" value="Videos"> Videos</label>
    <label><input type="checkbox" value="City Meetups"> City Meetups</label>
    <label><input type="checkbox" value="Wiki"> Wiki</label>
    <label><input type="checkbox" value="Forum"> Forum</label>
    <label><input type="checkbox" value="Additional Courses"> Additional Courses</label>
  </div>

  <label>Any comments or suggestions?</label>
  <textarea placeholder="Enter your comments here" rows="4" cols="30"></textarea>

  <input type="submit" id="submit"/>


</form>
</div>
</body>
</html>
