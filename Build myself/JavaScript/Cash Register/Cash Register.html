<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Register</title>
    <link rel="stylesheet" href="./Cash Register.css">
</head>

<body>
    <h1>Cash Register Project</h1>
    <div id="change-due"></div>

    <div>
        <label>Enter cash from customer:
            <input type="number" id="cash" step="0.01" min="0">
        </label>
        <button id="purchase-btn">Purchase</button>
    </div>

    <div>
        <h2>Change in drawer:</h2>
        <p>Pennies: $1.01</p>
        <p>Nickels: $2.05</p>
        <p>Dimes: $3.1</p>
        <p>Quarters: $4.25</p>
        <p>Ones: $90</p>
        <p>Fives: $55</p>
        <p>Tens: $20</p>
        <p>Twenties: $60</p>
    </div>

</body>
<script src="./Cash Register.js"></script>

</html>
