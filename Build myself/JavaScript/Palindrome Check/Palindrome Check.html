<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Palindrome Check.css">
    <title>Palindrome Checker</title>
</head>
<body>
    <h1>Is it a Palindrome?</h1>
    
    <div>
      <label>Enter in text to check for a palindrome:</label>
      <input id="text-input">
      <button id="check-btn">Check</button>
    </div>

    <div id="result"></div>

    <div>
      <p>A palindrome is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.</p>
    </div>
</body>
<script src="./Palindrome Check.js"></script>
</html>
